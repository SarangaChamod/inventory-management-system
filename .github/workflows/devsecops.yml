name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: store-management-api

jobs:
  # 1. Secret scanning: fail if credentials were committed
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Build, unit + integration tests, package
  build-test:
    name: Build & test (Maven, Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and run tests
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: store-management-api-jar
          path: target/store-management-api.jar
          retention-days: 7

  # 3. Dependency vulnerabilities + IaC/Dockerfile misconfigurations in the repo
  dependency-scan:
    name: Dependency & config scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # 4. Build the Docker image, scan it, smoke-test it
  docker:
    name: Docker build, scan & smoke test
    runs-on: ubuntu-latest
    needs: [ build-test, dependency-scan, secret-scan ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Smoke test with PostgreSQL
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          DB_PASSWORD="ci-$(openssl rand -hex 12)"
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_DB=storedb -e POSTGRES_USER=store_user -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            postgres:16-alpine
          docker run -d --name smoke-app --network smoke -p 8080:8080 \
            -e DB_HOST=smoke-db -e DB_PORT=5432 -e DB_NAME=storedb \
            -e DB_USERNAME=store_user -e DB_PASSWORD="$DB_PASSWORD" \
            "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health | tee /tmp/health.json | grep -q '"status":"UP"'; then
              echo "Application is healthy:"; cat /tmp/health.json; exit 0
            fi
            sleep 5
          done
          echo "Application did not become healthy"; docker logs smoke-app; exit 1
      - name: Clean up
        if: always()
        run: docker rm -f smoke-app smoke-db || true

  # 5. Publish the image to GitHub Container Registry (main branch only)
  publish:
    name: Publish image (GHCR)
    runs-on: ubuntu-latest
    needs: [ docker ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
