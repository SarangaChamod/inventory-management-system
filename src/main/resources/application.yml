# ---------------------------------------------------------------------------
# Default (production) configuration.
# All database settings come from environment variables; no credentials here.
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# ---------------------------------------------------------------------------
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: store-management-api
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: store-hikari-pool

  jpa:
    open-in-view: false
    hibernate:
      # Never let Hibernate change the production schema; Flyway owns it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ---------------------------------------------------------------------------
# Actuator: expose only health and info, no sensitive details.
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Show each component's status (db UP/DOWN) but no details such as DB vendor/URL.
      show-components: always
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
  info:
    env:
      enabled: true
    build:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: Store Management API
    description: Store Management REST API for products, categories and inventory
    version: "@project.version@"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.store.management: INFO
