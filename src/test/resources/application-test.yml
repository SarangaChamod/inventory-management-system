# Test profile: in-memory H2 in PostgreSQL compatibility mode.
# Flyway runs the same migrations as production and Hibernate validates the schema.
spring:
  datasource:
    url: jdbc:h2:mem:storedb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.store.management: WARN
